        - generic [ref=f15e77]:
          - paragraph [ref=f15e78]: FAQs
          - heading "Questions, answered." [level=2] [ref=f15e79]
          - paragraph [ref=f15e80]: The things guests most often ask before they book, from holding a room to cancelling one.
        - list [ref=f15e81]:
          - listitem [ref=f15e82]:
            - heading [level=3] [ref=f15e83]:
              - button "01 Do I need an account to see what is free?" [ref=f15e84] [cursor=pointer]:
                - generic [ref=f15e85]: "01"
                - generic [ref=f15e86]: Do I need an account to see what is free?
            - region "01 Do I need an account to see what is free?":
              - paragraph [ref=f15e91]:
                - text: No. Pick your dates and number of guests and every room shows how many are left. You only need an account when you book, so the stay is kept under your name.
                - link "Create one" [ref=f15e92] [cursor=pointer]:
                  - /url: /signup
                - text: in under a minute.
          - listitem [ref=f15e93]:
            - heading [level=3] [ref=f15e94]:
              - button "02 My booking says “pending”. Is the room mine?" [ref=f15e95] [cursor=pointer]:
                - generic [ref=f15e96]: "02"
                - generic [ref=f15e97]: My booking says “pending”. Is the room mine?
            - region "02 My booking says “pending”. Is the room mine?":
              - paragraph [ref=f15e101]: Yes. A pending booking holds the room exactly as a confirmed one does, so nobody else can take it for those nights. Pending only means payment has not been taken yet.
          - listitem [ref=f15e102]:
            - heading [level=3] [ref=f15e103]:
              - button "03 Can I cancel a booking?" [expanded] [active] [ref=f15e104] [cursor=pointer]:
                - generic [ref=f15e105]: "03"
                - generic [ref=f15e106]: Can I cancel a booking?
            - region "03 Can I cancel a booking?" [ref=f15e282]:
              - paragraph [ref=f15e110]:
                - text: Yes, any time up to the day you check in. Open
                - link "My bookings" [ref=f15e111] [cursor=pointer]:
                  - /url: /bookings
                - text: and choose Cancel; the room is released straight away. Once a stay has started it can no longer be cancelled online.
          - listitem [ref=f15e112]:
            - heading [level=3] [ref=f15e113]:
              - button "04 How long can I stay?" [ref=f15e114] [cursor=pointer]:
                - generic [ref=f15e115]: "04"
                - generic [ref=f15e116]: How long can I stay?
            - region "04 How long can I stay?":
              - paragraph [ref=f15e120]: Anything from one night up to 30. For a longer stay, make a second booking that starts on the day the first one ends.
          - listitem [ref=f15e121]:
            - heading [level=3] [ref=f15e122]:
              - button "05 How many guests can share a room?" [ref=f15e123] [cursor=pointer]:
                - generic [ref=f15e124]: "05"
                - generic [ref=f15e125]: How many guests can share a room?
            - region "05 How many guests can share a room?":
              - paragraph [ref=f15e129]:
                - text: Every room shows how many it sleeps, and a search only shows rooms that fit your whole party.
                - link "Compare the categories" [ref=f15e130] [cursor=pointer]:
                  - /url: /categories
                - text: to see them side by side.
          - listitem [ref=f15e131]:
            - heading [level=3] [ref=f15e132]:
              - button "06 How is the price worked out?" [ref=f15e133] [cursor=pointer]:
                - generic [ref=f15e134]: "06"
                - generic [ref=f15e135]: How is the price worked out?
            - region "06 How is the price worked out?":
              - paragraph [ref=f15e139]: Rooms are priced per night in USD. The total is simply the nightly rate times the number of nights, and it is shown before you book.
          - listitem [ref=f15e140]:
            - heading [level=3] [ref=f15e141]:
              - button "07 The room was free, then my booking failed. Why?" [ref=f15e142] [cursor=pointer]:
                - generic [ref=f15e143]: "07"
                - generic [ref=f15e144]: The room was free, then my booking failed. Why?
            - region "07 The room was free, then my booking failed. Why?":
              - paragraph [ref=f15e148]: Someone booked the last room for those nights a moment before you did. Nothing was reserved or charged; try different dates or another room.
          - listitem [ref=f15e149]:
